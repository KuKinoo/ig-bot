name: Daily draft

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 09:00 in Bratislava during summer time (08:00 in winter). Edit to taste.
  workflow_dispatch:       # "Run workflow" button, for testing

permissions:
  contents: write   # push the `data` branch
  actions: write    # best-effort keep-alive of the schedule (see last step)

# Daily job and Telegram handler share one lock so they never edit state.json at the same time.
concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITSYNC: "1"
      DATA_DIR: data
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional tuning - add as repository *variables* (Settings > Secrets and variables > Actions > Variables)
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
      IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
      BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
      BRAND_KICKER: ${{ vars.BRAND_KICKER }}
      BRAND_ACCENT: ${{ vars.BRAND_ACCENT }}
      RSS_FEEDS: ${{ vars.RSS_FEEDS }}
      MAX_SLIDE_IMAGES: ${{ vars.MAX_SLIDE_IMAGES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load state from the data branch
        run: bash scripts/data_branch.sh pull

      - name: Create draft and send it to Telegram
        run: python run_daily.py

      - name: Save state
        if: always()
        run: bash scripts/data_branch.sh push "daily run"

      - name: Keep the schedule alive (best effort)
        if: always()
        continue-on-error: true
        run: gh workflow enable daily.yml
